name: Nightly Android APK

# Building Android from scratch costs 50-75 min of CI time, so it only runs automatically on the
# dedicated dev-nightly branch. For any other branch use "Run workflow" and pick the ref manually.
on:
  push:
    branches:
      - dev-nightly
    # Documentation-only pushes are not worth a full NDK rebuild. workflow_dispatch is unaffected.
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch, tag or SHA to build'
        required: true
        default: 'all-enhancements'
        type: string

env:
  ANDROID_API_LEVEL: '35'
  ANDROID_BUILD_TOOLS: '36.0.0'
  ANDROID_NDK_VERSION: '29.0.14206865'
  VCPKG_ROOT: /usr/local/share/vcpkg
  # all-enhancements restricts abiFilters to arm64-v8a, so building the x64-android triplet would
  # only waste ~20 min (and its OpenSSL assembly does not build under the NDK anyway).
  VCPKG_TRIPLET: arm64-android

jobs:
  # A missing or wrong signing secret only surfaces 50-75 min into the native build, so validate
  # everything the build and the release step need in a job that finishes in seconds.
  preflight:
    name: Preflight checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    # Superseded runs should not hold a runner; the group name differs from the build job's because
    # jobs sharing a concurrency group cancel each other.
    concurrency:
      group: nightly-android-preflight-${{ github.event.inputs.branch || github.ref }}
      cancel-in-progress: true

    steps:
      - name: Check out ${{ github.event.inputs.branch || github.ref_name }}
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}
          # Full history so the predicted release tag matches the build job's "git rev-list --count".
          fetch-depth: 0
          # Only commits are needed for the tag prediction, so skip every historical blob.
          filter: blob:none
          # This job only stats a handful of paths; root files come with cone mode for free.
          sparse-checkout: |
            data
            vita3k/shaders-builtin
            android

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Check signing secrets are present
        env:
          SIGNING_STORE_BASE64: ${{ secrets.SIGNING_STORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for name in SIGNING_STORE_BASE64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing repository secret(s): ${missing[*]}. Without them android/app/build.gradle falls back to a debug key."
            exit 1
          fi
          echo "All four signing secrets are set."

      - name: Validate keystore, alias and passwords
        env:
          SIGNING_STORE_BASE64: ${{ secrets.SIGNING_STORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/preflight.jks"
          # Tolerate the wrapped base64 that "base64 -w0" avoids but pasted secrets often contain.
          if ! printf '%s' "$SIGNING_STORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$keystore" 2>/dev/null; then
            echo "::error::SIGNING_STORE_BASE64 is not valid base64."
            exit 1
          fi
          if [ ! -s "$keystore" ]; then
            echo "::error::SIGNING_STORE_BASE64 decoded to an empty file."
            exit 1
          fi
          if ! keytool -list -keystore "$keystore" -storepass "$SIGNING_STORE_PASSWORD" > /dev/null 2>&1; then
            echo "::error::Cannot open the keystore: SIGNING_STORE_BASE64 is corrupt or SIGNING_STORE_PASSWORD is wrong."
            exit 1
          fi
          if ! keytool -list -keystore "$keystore" -storepass "$SIGNING_STORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::SIGNING_KEY_ALIAS does not exist in the keystore. Aliases present:"
            keytool -list -keystore "$keystore" -storepass "$SIGNING_STORE_PASSWORD" 2>/dev/null \
              | awk -F, '/PrivateKeyEntry|trustedCertEntry/ { print "  " $1 }' >&2 || true
            exit 1
          fi
          # keytool -list never touches the key password and keytool -certreq silently accepts a
          # wrong one on PKCS12 stores, so sign a throwaway jar: that is the same code path Gradle
          # uses and it is the only check that actually fails on a bad SIGNING_KEY_PASSWORD.
          probe_dir="$RUNNER_TEMP/keyprobe"
          mkdir -p "$probe_dir"
          : > "$probe_dir/probe.txt"
          jar --create --file "$probe_dir/probe.jar" -C "$probe_dir" probe.txt
          if ! jarsigner -keystore "$keystore" -storepass "$SIGNING_STORE_PASSWORD" \
                 -keypass "$SIGNING_KEY_PASSWORD" "$probe_dir/probe.jar" "$SIGNING_KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::Cannot sign with alias '$SIGNING_KEY_ALIAS': SIGNING_KEY_PASSWORD is most likely wrong."
            exit 1
          fi
          echo "Keystore opens, alias exists and both passwords sign successfully."
          # An expired certificate still signs, but Play/installers may reject it later, so warn.
          valid_until="$(keytool -list -v -keystore "$keystore" -storepass "$SIGNING_STORE_PASSWORD" \
            -alias "$SIGNING_KEY_ALIAS" 2>/dev/null | sed -n 's/.*until: //p' | head -1)"
          if [ -n "$valid_until" ]; then
            echo "Certificate valid until: $valid_until"
            if [ "$(date -d "$valid_until" +%s 2>/dev/null || echo 0)" -lt "$(date +%s)" ]; then
              echo "::warning::The signing certificate has expired ($valid_until)."
            fi
          fi

      - name: Check build inputs exist
        run: |
          set -euo pipefail
          missing=()
          for path in vcpkg.json CMakeLists.txt data vita3k/shaders-builtin \
                      android/gradlew android/app/build.gradle android/gradle/wrapper/gradle-wrapper.properties; do
            [ -e "$path" ] || missing+=("$path")
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing path(s) required by the build: ${missing[*]}"
            exit 1
          fi
          # The build job runs :app:assembleNightly, so the build type has to exist on this ref.
          if ! grep -qE '^[[:space:]]*nightly[[:space:]]*\{' android/app/build.gradle; then
            echo "::error::android/app/build.gradle has no nightly build type; :app:assembleNightly would fail."
            exit 1
          fi
          # The signing config only takes effect when gradle reads these env vars.
          for var in SIGNING_STORE_PATH SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            grep -q "$var" android/app/build.gradle || {
              echo "::error::android/app/build.gradle no longer reads $var; the APK would be debug-signed."
              exit 1
            }
          done
          # This workflow's env pins the SDK/NDK it installs; a drift from build.gradle means Gradle
          # either re-downloads a second NDK or fails outright an hour in.
          gradle_ndk="$(sed -n 's/.*ndkVersion[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' android/app/build.gradle | head -1)"
          if [ -n "$gradle_ndk" ] && [ "$gradle_ndk" != "$ANDROID_NDK_VERSION" ]; then
            echo "::error::ndkVersion in android/app/build.gradle ($gradle_ndk) != workflow ANDROID_NDK_VERSION ($ANDROID_NDK_VERSION)."
            exit 1
          fi
          gradle_sdk="$(sed -n 's/.*compileSdk[[:space:]]*=[[:space:]]*\([0-9]*\).*/\1/p' android/app/build.gradle | head -1)"
          if [ -n "$gradle_sdk" ] && [ "$gradle_sdk" != "$ANDROID_API_LEVEL" ]; then
            echo "::error::compileSdk in android/app/build.gradle ($gradle_sdk) != workflow ANDROID_API_LEVEL ($ANDROID_API_LEVEL)."
            exit 1
          fi
          echo "Build inputs present; NDK $gradle_ndk and compileSdk $gradle_sdk match the workflow env."

      - name: Check release publishing prerequisites
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh auth status
          build_number="$(git rev-list --count HEAD)"
          short_sha="$(git rev-parse --short HEAD)"
          tag="android-nightly-${build_number}-${short_sha}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::Release $tag already exists; the build job's gh release create would fail after ~1h of work."
            exit 1
          fi
          echo "GitHub CLI is authenticated and tag $tag is free."

      - name: Preflight summary
        run: |
          set -euo pipefail
          {
            echo "### Preflight passed"
            echo
            echo "- Signing secrets present and verified against the keystore"
            echo "- Build inputs and nightly build type present"
            echo "- GitHub CLI authenticated for release publishing"
          } >> "$GITHUB_STEP_SUMMARY"

  nightly-apk:
    name: Nightly APK (arm64-v8a)
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 150

    # gh release create needs write access to the repository contents.
    permissions:
      contents: write

    # A second push while a build is running would burn another 50-75 min for an APK nobody wants,
    # so supersede the in-flight run instead.
    concurrency:
      group: nightly-android-${{ github.event.inputs.branch || github.ref }}
      cancel-in-progress: true

    steps:
      - name: Check out ${{ github.event.inputs.branch || github.ref_name }}
        uses: actions/checkout@v6
        with:
          # On push there is no branch input, so fall back to the ref that triggered the run.
          ref: ${{ github.event.inputs.branch || github.ref }}
          # vita3k/CMakeLists.txt runs "git rev-list HEAD --count" for the build number
          fetch-depth: 0
          # ... but only the commit list is needed, so historical blobs can stay on the server.
          filter: blob:none
          # Submodules are fetched shallowly in the next step instead: fetch-depth 0 would drag the
          # full history of all 28 of them, and only this repository's history feeds a build input.
          submodules: false

      - name: Check out submodules (shallow)
        run: |
          set -euo pipefail
          git submodule sync --recursive
          # --depth 1 fails when a submodule pins a commit that is not a branch tip, so fall back
          # to a full submodule clone rather than building against missing sources.
          git submodule update --init --recursive --depth 1 --jobs 4 --recommend-shallow \
            || git submodule update --init --recursive --jobs 4

      - name: Restore vcpkg cache
        uses: actions/cache@v5
        with:
          # "packages" holds multi-GB intermediate build trees that vcpkg can regenerate from
          # "archives", so caching it only slowed the save step down. "archives" is vcpkg's own
          # binary cache: on a key miss it turns a 15-20 min rebuild into an unzip.
          path: |
            ${{ env.VCPKG_ROOT }}/installed
            ~/.cache/vcpkg/archives
          # Keyed on vcpkg.json alone (it carries builtin-baseline, so version bumps are covered).
          # CMakeLists.txt and cmake/** change on nearly every commit here and do not affect which
          # ports vcpkg builds, so hashing them just guaranteed a miss plus a full re-upload.
          key: nightly-vcpkg-${{ env.VCPKG_TRIPLET }}-v2-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            nightly-vcpkg-${{ env.VCPKG_TRIPLET }}-v2-

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: on-failure
          cache-provider: basic
          validate-wrappers: false

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4

      # CMakeLists.txt picks ccache up from PATH on its own via CMAKE_CXX_COMPILER_LAUNCHER.
      - uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: nightly-android-ccache
          # The action defaults to 500M, but an arm64 Release build of 455 translation units plus
          # externals produces well over that, so every run used to evict the previous run's
          # objects and recompile from scratch.
          max-size: 2G
          verbose: 1

      - name: Install Android SDK packages and NDK
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          # The runner image usually ships the platform and build-tools already; only the pinned NDK
          # reliably needs downloading. Resolving the licence prompt and re-running sdkmanager for
          # packages that are already on disk costs minutes for nothing.
          packages=()
          [ -d "${sdk_root}/platforms/android-${ANDROID_API_LEVEL}" ] \
            || packages+=("platforms;android-${ANDROID_API_LEVEL}")
          [ -d "${sdk_root}/build-tools/${ANDROID_BUILD_TOOLS}" ] \
            || packages+=("build-tools;${ANDROID_BUILD_TOOLS}")
          [ -d "${sdk_root}/ndk/${ANDROID_NDK_VERSION}" ] \
            || packages+=("ndk;${ANDROID_NDK_VERSION}")
          if [ ${#packages[@]} -ne 0 ]; then
            echo "Installing: ${packages[*]}"
            set +o pipefail
            yes | sdkmanager --licenses > /dev/null
            set -o pipefail
            sdkmanager --install "${packages[@]}"
          else
            echo "Platform, build-tools and NDK are all already present."
          fi
          echo "ANDROID_NDK_HOME=${sdk_root}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install native dependencies with vcpkg
        run: |
          set -euo pipefail
          # Both the runner image and the Android SDK ship ninja; only pay for apt when it is absent.
          if ! command -v ninja > /dev/null; then
            sudo apt-get update
            sudo apt-get install -y ninja-build
          fi
          vcpkg install --triplet "$VCPKG_TRIPLET"

      - name: Stage emulator assets
        run: |
          set -euo pipefail
          mkdir -p android/app/assets
          rm -rf android/app/assets/data android/app/assets/shaders-builtin
          cp -r data android/app/assets/data
          cp -r vita3k/shaders-builtin android/app/assets/shaders-builtin

      - name: Decode signing keystore
        env:
          SIGNING_STORE_BASE64: ${{ secrets.SIGNING_STORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$SIGNING_STORE_BASE64" ]; then
            echo "SIGNING_STORE_BASE64 is not set; the APK would fall back to a debug key." >&2
            exit 1
          fi
          keystore="$RUNNER_TEMP/vita3kplus-release.jks"
          printf '%s' "$SIGNING_STORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$keystore"
          # Fail loudly here rather than shipping a debug-signed APK from a corrupt secret.
          keytool -list -keystore "$keystore" -storepass "$SIGNING_STORE_PASSWORD" > /dev/null
          echo "SIGNING_STORE_PATH=$keystore" >> "$GITHUB_ENV"

      # Without this the cache restored above is nearly useless: AGP compiles into
      # app/.cxx/nightly/<config-hash>/arm64-v8a, so the absolute paths baked into ccache's hashes
      # change whenever that hash changes, and vita3k/android/jni/native_bootstrap.cpp uses
      # __DATE__/__TIME__, which ccache refuses to cache unless told to.
      - name: Configure ccache for the native build
        run: |
          set -euo pipefail
          {
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
            echo "CCACHE_NOHASHDIR=true"
            echo "CCACHE_SLOPPINESS=time_macros,include_file_mtime,include_file_ctime,pch_defines,locale"
            echo "CCACHE_COMPRESS=1"
          } >> "$GITHUB_ENV"
          # Zero the counters so the "Print ccache statistics" step reports this run's hit rate
          # rather than the restored cache's lifetime totals.
          ccache -z

      - name: Build nightly APK
        working-directory: android
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --stacktrace :app:assembleNightly

      - name: Collect APK
        run: |
          set -euo pipefail
          # Build number matches vita3k/CMakeLists.txt's "git rev-list HEAD --count".
          build_number="$(git rev-list --count HEAD)"
          short_sha="$(git rev-parse --short HEAD)"
          out_dir=android/app/build/outputs/apk/nightly
          # Resolve by glob rather than hardcoding app-nightly.apk, so an archivesBaseName change
          # upstream does not silently break the job.
          apk="$(find "$out_dir" -maxdepth 1 -name '*.apk' -print -quit)"
          if [ -z "$apk" ]; then
            echo "No APK produced in $out_dir" >&2
            ls -alR "$out_dir" >&2 || true
            exit 1
          fi
          echo "Found $apk"
          base="Vita3K-Plus-nightly-${build_number}-${short_sha}-arm64"
          mkdir -p artifacts
          cp "$apk" "artifacts/${base}.apk"
          (cd artifacts && sha256sum "${base}.apk" > "${base}.apk.sha256")
          {
            echo "BUILD_NUMBER=${build_number}"
            echo "GIT_SHORT_SHA=${short_sha}"
            echo "GIT_FULL_SHA=$(git rev-parse HEAD)"
            echo "RELEASE_TAG=android-nightly-${build_number}-${short_sha}"
            echo "ARTIFACT_NAME=${base}"
            echo "LAST_COMMIT_MESSAGE=$(git log -1 --pretty=format:'%s')"
          } >> "$GITHUB_ENV"
          ls -al artifacts

      - name: Verify APK signature
        run: |
          set -euo pipefail
          build_tools="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}"
          "${build_tools}/apksigner" verify --print-certs artifacts/*.apk

      - name: Report APK identity
        run: |
          set -euo pipefail
          aapt="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}" -name aapt2 -print -quit)"
          "$aapt" dump badging artifacts/*.apk | grep -E "^package|application-label:|native-code" || true

      - name: Print ccache statistics
        if: always()
        run: ccache -s

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      # The workflow artifact above expires and needs a GitHub login to download; the release below
      # is the permanent, publicly downloadable copy.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ github.event.inputs.branch || github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          repo_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          # Written line by line instead of a heredoc: YAML block scalars force an indent that
          # would end up inside the markdown.
          {
            echo "Automated Android nightly build of Vita3K+."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Source ref | \`${SOURCE_REF}\` |"
            echo "| Commit | [\`${GIT_SHORT_SHA}\`](${repo_url}/commit/${GIT_FULL_SHA}) ${LAST_COMMIT_MESSAGE} |"
            echo "| Build number | ${BUILD_NUMBER} |"
            echo "| ABI | arm64-v8a only |"
            echo "| Application ID | \`org.vita3kplus.emulator.nightly\` |"
            echo "| Workflow run | [#${RUN_NUMBER}](${repo_url}/actions/runs/${RUN_ID}) |"
            echo
            echo "Signed with the project nightly key, so later nightlies install as updates over"
            echo "this one. The \`.nightly\` application ID suffix keeps the build side by side with"
            echo "upstream Vita3K and with a non-nightly Vita3K+ build."
            echo
            echo "Verify the download against the accompanying \`.sha256\` file before installing."
          } > "$notes"
          gh release create "$RELEASE_TAG" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GIT_FULL_SHA" \
            --title "Android Nightly ${BUILD_NUMBER} (${GIT_SHORT_SHA})" \
            --notes-file "$notes" \
            --prerelease

      - name: Link release in job summary
        run: |
          set -euo pipefail
          {
            echo "### Android nightly published"
            echo
            echo "[${RELEASE_TAG}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG})"
          } >> "$GITHUB_STEP_SUMMARY"
