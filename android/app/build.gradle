plugins {
	id 'com.android.application'
	id 'org.jetbrains.kotlin.plugin.compose'
}

def signingStorePath = System.getenv("SIGNING_STORE_PATH")
def signingStorePassword = System.getenv("SIGNING_STORE_PASSWORD")
def signingKeyAlias = System.getenv("SIGNING_KEY_ALIAS")
def signingKeyPassword = System.getenv("SIGNING_KEY_PASSWORD")
def hasCiSigning = signingStorePath && signingStorePassword && signingKeyAlias && signingKeyPassword

// res/values/strings.xml is the single English source of truth. Android treats the
// unqualified values/ bucket as "no locale match", so with per-app locales the
// effective list is [selected, system]: picking "en" finds no `en` bucket, falls
// through to the system locale and resolves Chinese instead. Deriving a real `en`
// bucket at build time keeps English selectable without duplicating the file in git.
def generatedEnResDir = layout.buildDirectory.dir("generated/res/localeEn")

android {
	namespace = "org.vita3k.emulator"
	compileSdk = 35
	ndkVersion = "29.0.14206865"
	buildFeatures {
		buildConfig = true
		compose = true
	}

	defaultConfig {
		// namespace stays org.vita3k.emulator: it is the Java package the JNI symbols are bound to
		applicationId = "org.vita3kplus.emulator"
		minSdk = 28
		targetSdk = 35
		versionCode = 110
		versionName = "1.1"

		ndk {
			// x86_64 is emulator-only and broken here: vcpkg OpenSSL cannot assemble its x86 SM3/SM4 code with the NDK.
			abiFilters "arm64-v8a"
		}
	}

	signingConfigs {
		ci {
			if (hasCiSigning) {
				storeFile = file(signingStorePath)
				storePassword = signingStorePassword
				keyAlias = signingKeyAlias
				keyPassword = signingKeyPassword
			}
		}
	}

	buildTypes {
		debug {
			debuggable = true
			jniDebuggable = true
			applicationIdSuffix = '.debug'
		}

		reldebug {
			debuggable = true
			jniDebuggable = true
			externalNativeBuild {
				cmake {
					arguments "-DCMAKE_BUILD_TYPE=RelWithDebInfo"
				}
			}
			minifyEnabled = false
			shrinkResources = false
			applicationIdSuffix = '.debug'
			signingConfig = signingConfigs.debug
		}

		release {
			debuggable = false
			jniDebuggable = false
			externalNativeBuild {
				cmake {
					arguments "-DCMAKE_BUILD_TYPE=Release"
				}
			}
			minifyEnabled = true
			shrinkResources = true
			proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
			signingConfig = hasCiSigning ? signingConfigs.ci : signingConfigs.debug
		}

		// Nightly: identical optimisation settings to release, but a distinct applicationId and
		// label so it installs side by side with both upstream Vita3K (org.vita3k.emulator) and a
		// future Vita3K+ release build (org.vita3kplus.emulator).
		// Everything is spelled out rather than using initWith, because initWith is not guaranteed
		// to carry externalNativeBuild arguments across AGP versions and silently falling back to
		// a Debug native build would cripple emulator performance.
		nightly {
			debuggable = false
			jniDebuggable = false
			externalNativeBuild {
				cmake {
					arguments "-DCMAKE_BUILD_TYPE=Release"
				}
			}
			minifyEnabled = true
			shrinkResources = true
			proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
			matchingFallbacks = ['release']
			applicationIdSuffix = '.nightly'
			signingConfig = hasCiSigning ? signingConfigs.ci : signingConfigs.debug
		}
	}

	compileOptions {
		sourceCompatibility JavaVersion.VERSION_17
		targetCompatibility JavaVersion.VERSION_17
	}

	sourceSets {
		main {
			jniLibs.srcDirs = ['../prebuilt']
			assets {
				srcDirs 'assets'
			}
			java {
				srcDirs += ['../../external/sdl/android-project/app/src/main/java']
			}
			res {
				srcDirs += generatedEnResDir
			}
		}
	}

	externalNativeBuild {
		cmake {
			path = '../../CMakeLists.txt'
			version = '3.22.1+'
		}
	}

	lint {
		abortOnError = false
		checkReleaseBuilds = false
	}
	packaging {
		jniLibs {
			useLegacyPackaging = true
		}
	}
}

// Derived resource: never edit, never commit. Regenerated from values/strings.xml
// on every build, so the two can never drift.
def copyEnStrings = tasks.register('copyEnStrings', Copy) {
	from('src/main/res/values') {
		include 'strings.xml'
	}
	into generatedEnResDir.map { it.dir('values-en') }
}

// Several AGP tasks consume the res source dirs (merge*Resources,
// map*SourceSetPaths, process*NavigationResources, ...). Rather than enumerate
// AGP internals, make every task that reads the generated dir depend on it.
tasks.configureEach { task ->
	if (task.name != 'copyEnStrings' && task.name =~ /(?i)(Resources|SourceSetPaths)$/) {
		task.dependsOn copyEnStrings
	}
}

dependencies {
	implementation 'androidx.appcompat:appcompat:1.6.1'
	implementation "androidx.core:core:1.12.0"
	implementation 'androidx.core:core-google-shortcuts:1.1.0'
	implementation 'com.google.android.material:material:1.11.0'
	implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
	implementation 'com.getkeepsafe.relinker:relinker:1.4.5'

	implementation platform('androidx.compose:compose-bom:2025.04.00')
	implementation 'androidx.compose.ui:ui'
	implementation 'androidx.compose.material3:material3'
	implementation 'androidx.compose.material:material-icons-extended'
	implementation 'androidx.compose.ui:ui-tooling-preview'
	implementation 'androidx.activity:activity-compose:1.9.3'
	implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
	implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
	implementation 'androidx.navigation:navigation-compose:2.8.5'
	implementation 'io.coil-kt:coil-compose:2.7.0'
	debugImplementation 'androidx.compose.ui:ui-tooling'
}
